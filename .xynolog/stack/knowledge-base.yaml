apiVersion: xynolog.org/v1alpha1
kind: KnowledgeBase
metadata:
  name: knowledge-base
spec:
  logLevel: info
  gateway:
    image: ghcr.io/xynolog/xynolog-gateway:latest
    resources:
      limits:
        memory: 2G
    port: 4000
    publicURL: http://localhost:4000
  dispatcher:
    image: ghcr.io/xynolog/xynolog-dispatcher:latest
    resources:
      limits:
        memory: 2G
  archivist:
    image: ghcr.io/xynolog/xynolog-archivist:latest
    resources:
      limits:
        memory: 2G
  messaging:
    jobs:
      type: jetstream
    signal:
      type: nats
    image: nats:2.15.2-alpine@sha256:823e7f1d6d8ffe3b30dbd73d4a06bbb939acf94929f7fdf224404da7a05bafb5
    resources:
      limits:
        memory: 512M
  issuer:
    shared:
      accessTokenLifespan: 300
    subjectClaim: sub
